<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --panel: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --key: #f4f4f5;
      --key-hover: #e4e4e7;
      --op: #e0e7ff;
      --op-text: #3730a3;
      --accent: #4f46e5;
      --accent-text: #ffffff;
      --shadow: 0 10px 30px rgb(0 0 0 / 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --panel: #18181b;
        --text: #fafafa;
        --muted: #a1a1aa;
        --key: #27272a;
        --key-hover: #3f3f46;
        --op: #312e81;
        --op-text: #c7d2fe;
        --accent: #6366f1;
        --accent-text: #ffffff;
        --shadow: 0 10px 30px rgb(0 0 0 / 0.5);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .calculator {
      width: min(100%, 320px);
      padding: 20px;
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .display {
      display: block;
      min-height: 64px;
      margin-bottom: 16px;
      padding: 8px 4px;
      text-align: right;
      font-size: 44px;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .key {
      aspect-ratio: 1;
      border: 0;
      border-radius: 16px;
      background: var(--key);
      color: var(--text);
      font: inherit;
      font-size: 22px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .key:hover { background: var(--key-hover); }
    .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .key--op { background: var(--op); color: var(--op-text); }
    .key--equals { background: var(--accent); color: var(--accent-text); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mountCalculator } from './src/ui.js';
    mountCalculator(document.getElementById('app'));
  </script>
</body>
</html>
